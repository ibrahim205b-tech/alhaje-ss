
name: Build Android APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        env:
          HAJI_KEYSTORE: ${{ secrets.HAJI_KEYSTORE }}
        run: |
          if [ -n "$HAJI_KEYSTORE" ]; then
            echo "$HAJI_KEYSTORE" | base64 -d > "$RUNNER_TEMP/haji.jks"
            echo "HAJI_KEYSTORE_FILE=$RUNNER_TEMP/haji.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::HAJI_KEYSTORE secret is not set: this APK uses a temporary key and cannot update the installed app."
          fi

      - name: Build APK
        env:
          HAJI_KEYSTORE_PASSWORD: ${{ secrets.HAJI_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alhaje-ss-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
